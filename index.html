<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D5BFF">
<title>Math Mayhem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one calm column on phones; on wide screens the live standings sit beside the question.
   Graph-paper ground, and the 12x12 multiplication chart is the recurring motif (results map). */
:root{
  --bg:#EEF2FA; --surface:#FFFFFF; --surface2:#E3E9F6; --fg:#121B33; --muted:#535E82; --line:#C9D3EA;
  --accent:#2D5BFF; --accent-fg:#FFFFFF; --grid:rgba(45,91,255,.07);
  --good:#0F9D58; --good-bg:#DDF5E7; --bad:#D92D3A; --bad-bg:#FDE3E5;
  --boost:#E09600; --boost-bg:#FFF1CC; --boost-fg:#5E3C00;
  --p0:#2D5BFF; --p1:#D6336C; --p2:#0B7A7C; --p3:#7B3FE4; --p4:#C2410C; --p5:#2B8A3E; --p6:#6D4C41; --p7:#37474F;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1224; --surface:#151E38; --surface2:#1F2B4F; --fg:#E9EEFF; --muted:#9AA6D0; --line:#2A3760;
    --accent:#7C97FF; --accent-fg:#0A1030; --grid:rgba(124,151,255,.08);
    --good:#3DD68C; --good-bg:#12382A; --bad:#FF6B76; --bad-bg:#40181D;
    --boost:#FFC24D; --boost-bg:#3B2C06; --boost-fg:#FFE0A0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1224; --surface:#151E38; --surface2:#1F2B4F; --fg:#E9EEFF; --muted:#9AA6D0; --line:#2A3760;
  --accent:#7C97FF; --accent-fg:#0A1030; --grid:rgba(124,151,255,.08);
  --good:#3DD68C; --good-bg:#12382A; --bad:#FF6B76; --bad-bg:#40181D;
  --boost:#FFC24D; --boost-bg:#3B2C06; --boost-fg:#FFE0A0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.45;
}
.shell{max-width:980px;margin:0 auto;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.1;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(32px,8vw,46px);font-weight:800}
h2{font-size:22px;font-weight:800}
p{margin:0}
.note{color:var(--muted);font-size:14px}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:22px;line-height:1}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font-family:var(--font-mono);font-size:13px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);display:inline-flex;gap:6px;align-items:center}
button.chip{cursor:pointer;font-family:var(--font-mono)}
.chip b{font-weight:500;letter-spacing:.12em}
.chip.warn{background:var(--boost-bg);color:var(--boost-fg);border-color:var(--boost)}

/* controls */
.btn{font:inherit;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-height:44px;padding:10px 18px;cursor:pointer;touch-action:manipulation}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.primary:active:not([disabled]){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.big{min-height:56px;font-size:18px;font-family:var(--font-display);font-weight:800}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.key:focus-visible,.segbtn:focus-visible,.chip:focus-visible,.avatar-btn:focus-visible,.input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.input{font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
.input.code{font-family:var(--font-mono);letter-spacing:.35em;text-align:center;text-transform:uppercase;padding-left:calc(14px + .35em)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.segbtn{font:inherit;font-weight:700;font-family:var(--font-mono);min-width:56px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;touch-action:manipulation}
.segbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.home{display:grid;gap:16px;max-width:560px;margin:0 auto}
.hero{display:grid;gap:8px;margin-bottom:4px}
.hero p{color:var(--muted);font-size:17px;max-width:46ch}
.namerow{display:flex;gap:10px;align-items:center}
.joinrow{display:flex;gap:10px}
.joinrow .input{flex:1}
.joinrow .btn{flex:none;min-width:96px}
.avatar{flex:none;width:var(--s,36px);height:var(--s,36px);border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:800;font-size:calc(var(--s,36px)*.46);background:var(--pc,var(--accent))}
.avatar-btn{flex:none;border:0;background:none;padding:0;cursor:pointer;border-radius:50%}
.steps{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:15px}

/* lobby */
.lobby{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.lobby{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.codetiles{display:flex;gap:8px;margin-top:8px}
.tile{width:clamp(48px,16vw,72px);aspect-ratio:3/4;display:grid;place-items:center;font-family:var(--font-mono);font-weight:500;font-size:clamp(28px,9vw,44px);background:var(--bg);border:1px solid var(--line);border-bottom-width:4px;border-radius:12px}
.plist{display:grid;gap:8px}
.lbrow{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.lbrow.me{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.lbrow .rk{font-family:var(--font-mono);font-weight:800;text-align:center}
.lbrow .sub{font-size:.8rem;color:var(--muted)}
.lbrow .sc{font-family:var(--font-mono);font-weight:800;font-size:1.1rem}
.input:disabled{opacity:.6;cursor:not-allowed}
.lblist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.track{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:8px 14px 8px 8px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.track::after{content:"";position:absolute;top:0;bottom:0;right:10px;width:10px;background:repeating-conic-gradient(var(--fg) 0 25%,var(--surface) 0 50%) 0 0/10px 10px;opacity:.55}
.lane{position:relative;height:34px;border-bottom:1px dashed var(--line);margin-right:18px}
.lane:last-child{border-bottom:0}
.lane .runner{position:absolute;top:0;left:0;display:flex;align-items:center;gap:4px;transition:left .5s ease-out;will-change:left}
.lane .runner .pt{font:700 .72rem var(--font-mono);color:var(--muted);white-space:nowrap}
.lane.me .runner .pt{color:var(--fg)}
.lane.me{background:linear-gradient(90deg,transparent,rgba(45,91,255,.08))}
.lane.ghost .runner{opacity:.6}
.track-cap{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin:0 0 4px}
@media (prefers-reduced-motion:reduce){.lane .runner{transition:none}}
.prow{display:flex;align-items:center;gap:10px;min-width:0}
.settings{display:grid;gap:14px}
.settings .field{display:grid;gap:6px}
.rules ul{margin:6px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.waiting{color:var(--muted);font-size:15px}

/* leaderboard */
.lb{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lb-row{display:grid;grid-template-columns:26px 36px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.lb-row.me{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rank{font-family:var(--font-mono);font-weight:500;color:var(--muted);text-align:center}
.lb-row:first-child .rank{color:var(--accent);font-weight:500}
.who{min-width:0}
.nmrow{display:flex;align-items:center;gap:6px;min-width:0}
.nmtxt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tag{flex:none;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.tag.boost{background:var(--boost-bg);color:var(--boost-fg)}
.meta{font-size:13px;color:var(--muted)}
.pts{font-family:var(--font-mono);font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}

/* game */
.game-grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:860px){.game-grid{grid-template-columns:minmax(0,1fr) minmax(0,340px)}}
.playcol{display:grid;gap:12px;min-width:0}
.hud{display:grid;gap:8px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.timer{font-family:var(--font-mono);font-size:46px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.timer small{font-size:14px;color:var(--muted);margin-left:4px}
.scorebox{text-align:right}
.scorebox .pts{font-size:34px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left center}
.bar.low>i{background:var(--bad)}
.statrow{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.statrow b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
.rankline{font-size:15px;font-weight:600;min-height:22px}
.boostbar{background:var(--boost-bg);color:var(--boost-fg);border:1px solid var(--boost);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 14px 16px;text-align:center;display:grid;gap:10px;justify-items:center;transition:background .12s,border-color .12s}
.qcard.good{background:var(--good-bg);border-color:var(--good)}
.qcard.bad{background:var(--bad-bg);border-color:var(--bad)}
.q{font-family:var(--font-display);font-weight:800;font-size:clamp(56px,18vw,96px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.q .x{color:var(--accent);padding:0 .14em}
.ans{min-height:62px;min-width:170px;font-family:var(--font-mono);font-size:44px;display:flex;justify-content:center;align-items:center;gap:3px;border-bottom:3px solid var(--line)}
.caret{width:3px;height:1em;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fb{min-height:26px;font-weight:700;font-size:17px}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.countnum{font-family:var(--font-display);font-weight:800;font-size:clamp(96px,30vw,150px);line-height:1;color:var(--accent);padding:12px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:380px;margin:0 auto;width:100%}
.key{font-family:var(--font-display);font-weight:800;font-size:26px;min-height:60px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:0 3px 0 var(--line);cursor:pointer;touch-action:manipulation;user-select:none}
.key:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.key.fn{font-size:16px;color:var(--muted)}
.key.go{background:var(--accent);color:var(--accent-fg);border-color:transparent;box-shadow:0 3px 0 rgba(0,0,0,.28);font-size:18px}
.keys.off{opacity:.45;pointer-events:none}
.side{display:grid;gap:10px;min-width:0}

/* wait + results */
.stack{display:grid;gap:16px;max-width:720px;margin:0 auto}
.winner{display:flex;gap:14px;align-items:center;padding:16px;border-radius:16px;background:var(--accent);color:var(--accent-fg)}
.winner .avatar{box-shadow:0 0 0 3px var(--accent-fg)}
.winner h2{font-size:clamp(22px,6vw,30px)}
.winner p{font-size:14px;opacity:.9}
.awards{display:flex;flex-wrap:wrap;gap:10px}
.award{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:14px;display:grid;gap:2px}
.award b{font-family:var(--font-display);font-size:16px}
.mapwrap{overflow-x:auto}
.map{display:grid;grid-template-columns:22px repeat(12,minmax(22px,1fr));gap:3px;min-width:330px;font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.map .lab{display:grid;place-items:center}
.cell{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.cell.ok{background:var(--good)} .cell.miss{background:var(--bad)} .cell.mid{background:var(--boost)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--surface2)}
.legend .l-ok::before{background:var(--good)} .legend .l-miss::before{background:var(--bad)} .legend .l-mid::before{background:var(--boost)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;gap:2px}
.stat b{font-family:var(--font-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.hrow span:last-child{font-family:var(--font-mono)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.pfline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pfblock{display:grid;gap:12px;min-width:0}
.codebig{font-family:var(--font-mono);font-weight:500;font-size:clamp(22px,7vw,30px);letter-spacing:.08em;padding:6px 12px;border:1px dashed var(--accent);border-radius:12px;background:var(--bg)}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{font-family:var(--font-mono);padding:6px 10px;border-radius:10px;background:var(--bad-bg);border:1px solid var(--bad)}
.mchip i{font-style:normal;color:var(--muted);font-size:12px;margin-left:6px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:90vw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div class="shell">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var COLORS=8;
var NAMES_A=['Turbo','Sneaky','Fuzzy','Cosmic','Soggy','Mighty','Spicy','Wobbly','Rapid','Sleepy','Dizzy','Crispy','Ninja','Grumpy','Electric','Chaotic'];
var NAMES_B=['Calculator','Potato','Penguin','Pancake','Walrus','Abacus','Llama','Noodle','Raccoon','Waffle','Banana','Hamster','Pretzel','Octopus','Cactus','Goblin'];
var NAMES_C=['Sir Times-a-Lot','Prime Suspect','Count Divide-ula','Product Placement','Factor Fiction','Pie Are Squared','Table Flipper','The Multiplicator','Lord of the Rows','Carry the Won'];
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var rint=function(n){return Math.floor(Math.random()*n)};
var pick=function(a){return a[rint(a.length)]};
function clampN(v,lo,hi){v=Number(v);return Number.isFinite(v)?Math.min(hi,Math.max(lo,Math.round(v))):lo}
function cleanName(s){return String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁯﻿]/g,'').replace(/\s+/g,' ').trim().slice(0,20)}
function randomName(){return (Math.random()<0.4?pick(NAMES_C):pick(NAMES_A)+' '+pick(NAMES_B)).slice(0,20)}
function randomCode(){var L='ABCDEFGHJKMNPQRSTUVWXYZ',c='';for(var i=0;i<4;i++)c+=L[rint(L.length)];return c}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function ordinal(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(){var x=2166136261;for(var i=0;i<arguments.length;i++){x^=(arguments[i]>>>0);x=Math.imul(x,16777619)>>>0}return x>>>0}
function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs)for(var k in attrs){
    var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);

  }
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);

  }
  return e;
}
function avatar(n,c,s){
  var ch=Array.from(n||'?')[0]||'?';
  return h('span',{class:'avatar',style:'--s:'+s+'px;--pc:var(--p'+c+')','aria-hidden':'true'},ch.toUpperCase());
}
function tag(t,cls){return h('span',{class:'tag'+(cls?' '+cls:'')},t)}
var toastTO;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTO);toastTO=setTimeout(function(){t.hidden=true},1900)}

/* ---------- game server (Supabase): live rooms use Realtime presence, profiles use a few locked-down functions ---------- */
var SUPABASE_URL='https://gkgoviulsyjqvwlzyiib.supabase.co';
var SUPABASE_KEY='sb_publishable_F4i7QjnrLSZiGYKhv2hOaw_ELREw-1r'; /* public "anon" key: safe to ship, the database only exposes the tts_profile_* functions */
function makeRoomApi(sb){
  // Presence is rate-limited by Supabase (5 updates / 30 s per client), so it is used ONLY for
  // "who is in the room" (tracked once + rare slow updates). All live game state travels by Broadcast.
  var myKey='k'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  return {join:function(name){
    return new Promise(function(resolve,reject){
      var mine={},conn=false,settled=false,left=false,fireT=null,bcT=null,trT=null,hbT=null,pSubs=[],cSubs=[];
      var lastBc='',lastTrack='',lastTrackAt=0,tracked=false,peerData={};
      var TRACK_GAP=12000;
      var ch=sb.channel('tts-'+name,{config:{presence:{key:myKey},broadcast:{self:false}}});
      function entry(k,pr){return {peer:k,by:null,isMe:k===myKey,sameTab:k===myKey,kind:'viewer',guest:false,presence:pr,updatedAt:0}}
      function build(){
        var st=ch.presenceState(),arr=[],seenMe=false;
        Object.keys(st).forEach(function(k){
          var metas=st[k];if(!metas||!metas.length)return;
          var m=metas[metas.length-1],pr={};
          if(k===myKey){pr=Object.assign({},mine);seenMe=true}
          else if(peerData[k])pr=Object.assign({},peerData[k]);
          else Object.keys(m).forEach(function(f){if(f!=='presence_ref')pr[f]=m[f]});
          arr.push(entry(k,pr));
        });
        if(!seenMe)arr.push(entry(myKey,Object.assign({},mine)));
        return arr;
      }
      function fire(){fireT=null;if(left)return;var snap=build();pSubs.slice().forEach(function(f){try{f({peers:snap})}catch(e){}})}
      function fireSoon(){if(!fireT)fireT=setTimeout(fire,0)}
      function cFire(){cSubs.slice().forEach(function(f){try{f(conn)}catch(e){}})}
      function sendBc(force){
        bcT=null;
        if(!conn||left||!Object.keys(mine).length)return;
        var js=JSON.stringify(mine);
        if(!force&&js===lastBc)return;
        lastBc=js;
        try{ch.send({type:'broadcast',event:'st',payload:{k:myKey,d:mine}})}catch(e){}
      }
      function bcSoon(){if(!bcT)bcT=setTimeout(function(){sendBc(false)},200)}
      function doTrack(){
        trT=null;
        if(!conn||left||!Object.keys(mine).length)return;
        var js=JSON.stringify(mine);
        if(tracked&&js===lastTrack)return;
        tracked=true;lastTrack=js;lastTrackAt=Date.now();
        try{ch.track(Object.assign({},mine))}catch(e){}
      }
      function trackSoon(){
        if(trT||!conn||left)return;
        if(!tracked){trT=setTimeout(doTrack,100);return}
        var wait=Math.max(300,TRACK_GAP-(Date.now()-lastTrackAt));
        trT=setTimeout(doTrack,wait);
      }
      var api={name:name,
        presence:function(patch){
          Object.keys(patch).forEach(function(k){if(patch[k]===null)delete mine[k];else mine[k]=patch[k]});
          bcSoon();trackSoon();fireSoon();return Promise.resolve();
        },
        peers:build,
        onPeers:function(fn){pSubs.push(fn);fireSoon();return function(){pSubs=pSubs.filter(function(f){return f!==fn})}},
        connected:function(){return conn},
        onConnection:function(fn){cSubs.push(fn);setTimeout(function(){fn(conn)},0);return function(){cSubs=cSubs.filter(function(f){return f!==fn})}},
        leave:function(){left=true;clearTimeout(trT);clearTimeout(bcT);clearTimeout(fireT);clearInterval(hbT);try{sb.removeChannel(ch)}catch(e){}return Promise.resolve()}};
      var to=setTimeout(function(){if(!settled){settled=true;try{sb.removeChannel(ch)}catch(e){}reject(new Error('timeout'))}},9000);
      ch.on('presence',{event:'sync'},fireSoon);
      ch.on('presence',{event:'join'},function(p){
        if(p&&p.key===myKey)return;
        setTimeout(function(){sendBc(true)},100+Math.random()*500);   // greet newcomer with my state
      });
      ch.on('presence',{event:'leave'},function(p){if(p&&p.key)delete peerData[p.key];fireSoon()});
      ch.on('broadcast',{event:'st'},function(m){
        var pl=m&&m.payload;if(!pl||!pl.k||pl.k===myKey||!pl.d)return;
        peerData[pl.k]=pl.d;fireSoon();
      });
      ch.subscribe(function(status){
        if(left)return;
        if(status==='SUBSCRIBED'){
          conn=true;
          if(Object.keys(mine).length){ if(!tracked)doTrack(); sendBc(true) }
          clearInterval(hbT);hbT=setInterval(function(){sendBc(true)},4000);   // heartbeat covers dropped messages
          cFire();fireSoon();
          if(!settled){settled=true;clearTimeout(to);resolve(api)}
        }else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
          conn=false;cFire();
          if(!settled){settled=true;clearTimeout(to);reject(new Error(status))}
        }
      });
    });
  }};
}

/* ---------- state ---------- */
var S={name:'',color:0,mode:'home',sub:'',nameTouched:false,roomState:'connecting',room:null,nr:null,code:'',conn:true,err:'',busy:false,
  settings:{du:60,mx:12},soloGame:null,seen:false,lastG:0,resTab:'round',unsubs:[]};

var P={G:null,i:0,q:null,qShown:-1,typed:'',lock:false,flash:'',fbText:'',fbKind:'',countEnd:0,roundEnd:0,
  missed:new Map(),grid:new Map(),fr:new Map(),recorded:false,timer:null,best:0,newBest:false};

/* ---------- profile: a short code opens the same profile on any device (kept on the game server, never in the browser) ---------- */
var PF={data:null,sb:null,dbState:'connecting',code:'',state:'none',busy:false,msg:'',q:Promise.resolve()};
function blankProfile(){return {name:'',color:0,rounds:0,right:0,wrong:0,bestStreak:0,bestScore:0,best:{},facts:{},recent:[],created:Date.now(),updated:0}}
PF.data=blankProfile();
function sanitizeProfile(o){
  var b=blankProfile();if(!o||typeof o!=='object')return b;
  var n=function(v,hi){return clampN(v,0,hi)};
  b.name=cleanName(o.name);b.color=n(o.color,COLORS-1);b.rounds=n(o.rounds,1e6);b.right=n(o.right,1e8);b.wrong=n(o.wrong,1e8);
  b.bestStreak=n(o.bestStreak,1e5);b.bestScore=n(o.bestScore,1e6);b.created=n(o.created,8.64e15)||Date.now();b.updated=n(o.updated,8.64e15);
  if(o.best&&typeof o.best==='object')Object.keys(o.best).slice(0,40).forEach(function(k){if(/^\d{2,3}-\d{1,2}$/.test(k))b.best[k]=n(o.best[k],1e6)});
  if(o.facts&&typeof o.facts==='object')Object.keys(o.facts).slice(0,200).forEach(function(k){var v=o.facts[k];if(/^\d{1,2}x\d{1,2}$/.test(k)&&Array.isArray(v))b.facts[k]=[n(v[0],1e6),n(v[1],1e6)]});
  if(Array.isArray(o.recent))b.recent=o.recent.slice(0,10).map(function(r){r=r||{};return {t:n(r.t,8.64e15),sc:n(r.sc,1e5),r:n(r.r,1e4),w:n(r.w,1e4),du:[45,60,90].indexOf(r.du)>=0?r.du:60,mx:clampN(r.mx,6,12),m:r.m==='solo'?'solo':'room'}});

var LB={state:'idle',data:null,cb:null};
async function loadLeaderboard(){
  if(!PF.sb){LB.state='error';if(LB.cb)LB.cb();return}
  LB.state='loading';if(LB.cb)LB.cb();
  try{
    var r=await PF.sb.rpc('tts_leaderboard',{p_code:PF.code||null});
    if(r.error||!r.data)throw new Error('lb');
    LB.data=r.data;LB.state='ready';
  }catch(e){LB.state='error'}
  if(LB.cb)LB.cb();
}
function normCode(c){return String(c==null?'':c).toUpperCase().replace(/[^A-Z0-9]/g,'')}
var CODE_WORDS='WALRUS LLAMA NOODLE PANCAKE PENGUIN POTATO RACCOON WAFFLE BANANA HAMSTER PRETZEL OCTOPUS CACTUS GOBLIN ABACUS NINJA COMET ROBOT TIGER OTTER MANGO PIZZA DRAGON FALCON PICKLE BISCUIT KOALA TOASTER ROCKET MUFFIN BADGER SPROUT WIZARD DONUT GECKO PLANET BAGEL SQUID TURNIP YETI PANDA APPLE LEMON PEACH GRAPE CLOUD RIVER MAPLE EAGLE ZEBRA MONKEY RABBIT FROG PARROT SHARK WHALE CANDY COOKIE'.split(' ');
function nameKey(x){return String(x==null?'':x).toLowerCase().replace(/[^\p{L}\p{N}]/gu,'')}
function isLegacy(x){return /^([A-Z]{3,8}[0-9]{4}|[A-Z]{9,30})$/.test(normCode(x))}
function validCode(n){return nameKey(n).length>=3}
function splitWords(n){
  if(!n)return [];
  for(var i=0;i<CODE_WORDS.length;i++){var w=CODE_WORDS[i];
    if(n.indexOf(w)===0){var rest=splitWords(n.slice(w.length));if(rest)return [w].concat(rest)}}
  return null;
}
function displayCode(n){
  if(!n)return '';
  if(/^[A-Z]{3,8}[0-9]{4}$/.test(n))return n.slice(0,-4)+'-'+n.slice(-4);   // older WORD1234 profiles
  if(/^[A-Z]{9,30}$/.test(n)){var parts=splitWords(n);return parts?parts.join('-'):n}
  return n;
}

function rpcKind(err){var m=String(err&&err.message||'');return /invalid_code/.test(m)?'invalid':/not_found/.test(m)?'notfound':'error'}
async function openProfile(code){
  var typed=String(code==null?'':code).replace(/\s+/g,' ').trim();
  if(!validCode(typed))return 'invalid';
  if(!PF.sb)return 'error';
  try{
    var r=await PF.sb.rpc('tts_profile_get',{p_code:typed});
    if(r.error)return rpcKind(r.error);
    if(!r.data)return 'notfound';
    PF.data=sanitizeProfile(r.data);
    // a profile's code is its name; older profiles keep working with their old code until renamed
    PF.code=(isLegacy(typed)&&nameKey(PF.data.name)!==nameKey(typed))?normCode(typed):(cleanName(PF.data.name)||typed);
    PF.state='ready';PF.msg='';
    lsSet('tts-code',PF.code);
    setTimeout(loadLeaderboard,0);
    S.name=cleanName(PF.data.name)||S.name;S.color=PF.data.color;S.nameTouched=false;
    return 'ok';
  }catch(e){return 'error'}
}
async function createProfile(){
  if(!PF.sb)return 'error';
  if(nameKey(S.name).length<3)return 'bad';
  try{
    var r=await PF.sb.rpc('tts_profile_create',{p_name:S.name,p_color:S.color});
    if(r.error){var m=String(r.error.message||'');return /taken/.test(m)?'taken':/bad_name/.test(m)?'bad':'error'}
    if(!r.data)return 'error';
    PF.code=String(r.data);PF.data=blankProfile();PF.data.name=S.name;PF.data.color=S.color;PF.state='ready';PF.msg='';
    lsSet('tts-code',PF.code);
    setTimeout(loadLeaderboard,0);
    return 'ok';
  }catch(e){return 'error'}
}
function closeProfile(){setTimeout(loadLeaderboard,0);PF.data=blankProfile();PF.code='';PF.state='none';PF.msg='';lsSet('tts-code','')}
/* one request at a time; the server adds each round to the stored profile, so two devices never overwrite each other */
function callProfile(fn,args){
  if(!PF.code)return Promise.resolve();
  PF.q=PF.q.then(async function(){
    var code=PF.code;if(!code)return;
    for(var t=0;t<2;t++){
      try{
        var r=await PF.sb.rpc(fn,Object.assign({p_code:code},args));
        if(r.error)throw r.error;
        if(PF.code===code&&r.data){PF.data=sanitizeProfile(r.data);PF.msg=''}
        break;
      }catch(e){
        if(/too_soon/.test(String(e&&e.message)))break;   // already saved (a retry after a slow connection)
        if(t===1||rpcKind(e)!=='error'){PF.msg='Could not save to your profile. Check your connection.';break}
        await sleep(700);
      }
    }
    refreshProfileUI();
  });
  return PF.q;
}
function syncIdentityToProfile(){
  if(!PF.code||PF.state!=='ready')return;
  if(PF.data.name===S.name&&PF.data.color===S.color&&nameKey(PF.code)===nameKey(S.name))return;
  if(nameKey(S.name)!==nameKey(PF.code)){
    if(nameKey(S.name).length<3){PF.msg='Names need at least 3 letters or numbers.';S.name=PF.data.name;S.nameTouched=false;refreshProfileUI();return}
    var oldCode=PF.code,want=S.name,col=S.color;
    PF.q=PF.q.then(async function(){
      try{
        var r=await PF.sb.rpc('tts_profile_rename',{p_code:oldCode,p_name:want,p_color:col});
        if(r.error)throw r.error;
        if(PF.code===oldCode&&r.data){PF.code=String(r.data.code);PF.data=sanitizeProfile(r.data.data);PF.msg='';lsSet('tts-code',PF.code);setTimeout(loadLeaderboard,0)}
      }catch(e){
        var m=String(e&&e.message||'');
        PF.msg=/taken/.test(m)?'The name "'+want+'" is already taken, so your profile stays "'+PF.data.name+'". Try another name.':/bad_name/.test(m)?'Names need at least 3 letters or numbers.':'Could not save the new name. Check your connection.';
        S.name=cleanName(PF.data.name)||S.name;S.nameTouched=false;
      }
      refreshProfileUI();
    });
    return;
  }
  callProfile('tts_profile_set_identity',{p_name:S.name,p_color:S.color});
}
function profileLine(){return PF.state==='ready'?'Profile "'+displayCode(PF.code)+'". Type this name on any device to open it.':'Playing without a profile. Scores are not saved.'}
function recordRound(){
  var g=P.G;
  if(!g||P.recorded||me.r+me.w===0)return;
  P.recorded=true;
  var key=g.du+'-'+g.mx,prev=PF.data.best[key]||0;
  P.newBest=prev>0&&me.sc>prev;P.best=Math.max(prev,me.sc);
  if(!PF.code)return;
  var fr={};P.fr.forEach(function(v,k){fr[k]=[v[0],v[1]]});
  callProfile('tts_profile_apply_round',{p_delta:{r:me.r,w:me.w,bs:me.bs,sc:me.sc,du:g.du,mx:g.mx,m:S.mode==='solo'?'solo':'room',fr:fr,name:S.name,color:S.color}});
}
function copyProfileCode(){
  var p;try{p=navigator.clipboard.writeText(displayCode(PF.code))}catch(e){p=Promise.reject(e)}
  p.then(function(){toast('Profile code copied')},function(){toast('Your code: '+displayCode(PF.code))});
}
function refreshProfileUI(){if(curView&&curView.pull)curView.pull();render()}
function resetMe(){Object.assign(me,{rd:0,base:0,br:0,bw:0,sc:0,r:0,w:0,st:0,bs:0,lv:0,fin:0,phase:'idle'});P.G=null;clearInterval(P.timer)}

/* ---------- room data ---------- */
function players(){
  if(S.mode==='solo')return [{id:'me',isMe:true,h:true,n:S.name,c:S.color,rd:me.rd,sc:me.sc,r:me.r,w:me.w,st:me.st,bs:me.bs,lv:me.lv,fin:me.fin,base:me.base,br:me.br,bw:me.bw}];
  if(!S.nr)return [];
  return S.nr.peers().filter(function(p){return p.kind==='viewer'&&p.presence&&p.presence.n!=null}).map(function(p){
    var x=p.presence;
    return {id:p.peer,isMe:!!p.sameTab,h:x.h===1,n:cleanName(x.n)||'Mystery player',c:clampN(x.c,0,COLORS-1),
      rd:clampN(x.rd,0,9999),sc:clampN(x.sc,0,99999),r:clampN(x.r,0,9999),w:clampN(x.w,0,9999),st:clampN(x.st,0,9999),bs:clampN(x.bs,0,9999),
      lv:clampN(x.lv,0,2),fin:x.fin?1:0,base:clampN(x.base,0,999999),br:clampN(x.br,0,99999),bw:clampN(x.bw,0,99999)};
  });
}
function game(){
  if(S.mode==='solo')return S.soloGame;
  if(!S.nr)return null;
  var hs=S.nr.peers().filter(function(p){return p.kind==='viewer'&&p.presence&&p.presence.h===1&&p.presence.n!=null}).sort(function(a,b){return a.peer<b.peer?-1:1});
  if(!hs.length)return null;
  var x=hs[0].presence;
  return {hostIsMe:!!hs[0].sameTab,ph:(x.ph==='play'||x.ph==='results')?x.ph:'lobby',g:clampN(x.g,0,9999),sd:clampN(x.sd,0,2147483000),
    du:[45,60,90].indexOf(x.du)>=0?x.du:60,mx:clampN(x.mx,6,12)};
}
function setPresence(patch){if(S.nr)S.nr.presence(patch).catch(function(){})}
function pushMe(){setPresence({rd:me.rd,base:me.base,br:me.br,bw:me.bw,sc:me.sc,r:me.r,w:me.w,st:me.st,bs:me.bs,lv:me.lv,fin:me.fin})}
function hostSet(patch){if(S.mode==='solo'){Object.assign(S.soloGame,patch);sync()}else setPresence(patch)}
var cmp=function(a,b){return b.sc-a.sc||a.w-b.w||(a.n<b.n?-1:a.n>b.n?1:0)||(a.id<b.id?-1:1)};

  return players().map(function(p){return p.isMe&&me.rd===g.g?Object.assign({},p,{sc:me.sc,r:me.r,w:me.w,lv:me.lv,fin:me.fin,bs:me.bs}):p}).filter(function(p){return p.rd===g.g}).sort(cmp);

/* ---------- game logic ---------- */
function makeQ(g,i,t,lv){
  var rng=mulberry32(hash(g.sd,g.g,i,t,lv));var a,b;
  if(lv>0){
    var pool=(lv===2?[2,5,10]:[2,3,4,5,10,11]).filter(function(x){return x<=g.mx});
    if(!pool.length)pool=[2];
    a=pool[Math.floor(rng()*pool.length)];b=1+Math.floor(rng()*10);
  }else{a=2+Math.floor(rng()*(g.mx-1));b=1+Math.floor(rng()*12)}
  return {a:a,b:b,flip:rng()<0.5,ans:a*b};
}
function updateLevel(){
  if(S.mode==='solo'){me.lv=0;return}
  var ps=roundPlayers(P.G);
  var lead=ps.reduce(function(m,p){return Math.max(m,p.sc)},0);
  var gap=lead-me.sc,lv=me.lv;
  if(gap>=100)lv=2;else if(gap>=70&&lv===2)lv=2;else if(gap>=40)lv=1;else if(gap>=25&&lv>=1)lv=1;else lv=0;
  me.lv=lv;
}
function nextQuestion(){
  if(me.phase!=='play')return;
  updateLevel();
  var q;
  for(var t=0;t<6;t++){q=makeQ(P.G,P.i,t,me.lv);if(!P.q||q.a!==P.q.a||q.b!==P.q.b)break}
  P.i++;P.q=q;P.typed='';P.flash='';P.fbText='';P.fbKind='';
  pushMe();
}
function beginRound(g){
  if(me.rd>0&&me.rd<g.g){me.base+=me.sc;me.br+=me.r;me.bw+=me.w}
  Object.assign(me,{rd:g.g,sc:0,r:0,w:0,st:0,bs:0,lv:0,fin:0,phase:'count'});
  P.G=g;P.i=0;P.q=null;P.qShown=-1;P.typed='';P.lock=false;P.flash='';P.fbText='';P.fbKind='';
  P.missed=new Map();P.grid=new Map();P.fr=new Map();P.recorded=false;P.newBest=false;
  P.best=PF.data.best[g.du+'-'+g.mx]||0;
  var now=Date.now();P.countEnd=now+3000;P.roundEnd=P.countEnd+g.du*1000;
  pushMe();
  clearInterval(P.timer);P.timer=setInterval(tick,100);
  if(g.hostIsMe&&S.mode==='room'){
    clearTimeout(hostTO);
    hostTO=setTimeout(function(){var c=game();if(c&&c.hostIsMe&&c.ph==='play'&&c.g===g.g)hostSet({ph:'results'})},(3+g.du+8)*1000);
  }
}
function abortRound(){clearInterval(P.timer);me.phase='idle';P.lock=false}
function finishRound(){
  clearInterval(P.timer);me.phase='done';me.fin=1;P.lock=false;
  recordRound();
  if(S.mode==='solo')S.soloGame.ph='results';
  pushMe();sync();
}
function tick(){
  var now=Date.now();
  if(me.phase==='count'){
    if(now>=P.countEnd){me.phase='play';nextQuestion();render()}
    else if(GV)GV.count.textContent=String(Math.ceil((P.countEnd-now)/1000));
    return;
  }
  if(me.phase==='play'){
    if(now>=P.roundEnd){finishRound();return}
    updateTimer(now);
  }
}
function recordGrid(q,ok){
  var key=q.a+'x'+q.b;var prev=P.grid.get(key);
  P.grid.set(key,(prev==='miss'||!ok)?'miss':'ok');
  var f=P.fr.get(key)||[0,0];f[ok?0:1]++;P.fr.set(key,f);
}
function inputDigit(d){
  if(me.phase!=='play'||P.lock||!P.q)return;
  if(P.typed.length<4)P.typed+=d;
  if(P.typed.length>=String(P.q.ans).length)submit();else drawGame();
}
function backspace(){if(me.phase!=='play'||P.lock)return;P.typed=P.typed.slice(0,-1);drawGame()}
function submit(){
  if(me.phase!=='play'||P.lock||!P.typed||!P.q)return;
  var q=P.q,ok=Number(P.typed)===q.ans;
  recordGrid(q,ok);P.lock=true;
  var qi=P.i;
  if(ok){
    var pts=10+Math.min(me.st,5)*2;
    me.st++;me.bs=Math.max(me.bs,me.st);me.sc+=pts;me.r++;
    P.flash='good';P.fbKind='good';P.fbText='+'+pts;
    setTimeout(function(){P.lock=false;if(P.i===qi){nextQuestion();drawGame()}},220);
  }else{
    me.w++;me.st=0;
    var key=q.a+'x'+q.b,m=P.missed.get(key)||{a:q.a,b:q.b,n:0};m.n++;P.missed.set(key,m);
    P.flash='bad';P.fbKind='bad';P.fbText=q.a+' × '+q.b+' = '+q.ans;
    setTimeout(function(){P.lock=false;if(P.i===qi){nextQuestion();drawGame()}},1100);
  }
  pushMe();drawGame();
}
function hostCheck(){
  var g=game();
  if(!g||!g.hostIsMe||g.ph!=='play'||S.mode==='solo')return;
  var ps=players().filter(function(p){return p.rd===g.g});
  if(ps.length&&ps.every(function(p){return p.fin}))hostSet({ph:'results'});
}
function syncGame(){
  var g=game();if(!g)return;
  if(!S.seen){S.seen=true;S.lastG=g.g;if(g.ph==='play')me.phase='idle'}
  if(g.ph==='play'&&g.g>S.lastG){S.lastG=g.g;beginRound(g)}
  if(g.ph==='lobby'&&me.phase!=='idle')abortRound();
}
function sync(){syncGame();hostCheck();render()}

function startRound(){
  var g=game();if(!g||!g.hostIsMe)return;
  hostSet({ph:'play',g:g.g+1,sd:1+rint(2147483000),du:60,mx:12});
}

/* ---------- joining, leaving ---------- */
function setErr(m){S.err=m||'';render()}
function enterRoom(nr,code,asHost){
  resetMe();S.nr=nr;S.code=code;S.mode='room';S.seen=false;S.lastG=0;S.conn=true;S.err='';S.resTab='round';
  S.unsubs=[
    nr.onPeers(function(){sync()},function(){leaveRoom('The connection to the room ended.')}),
    nr.onConnection(function(c){
      clearTimeout(connTO);
      if(c){S.conn=true;renderTop()}else connTO=setTimeout(function(){S.conn=nr.connected();renderTop()},2000);
    })
  ];
  var base={n:S.name,c:S.color,rd:0,sc:0,r:0,w:0,st:0,bs:0,lv:0,fin:0,base:0,br:0,bw:0};
  if(asHost)Object.assign(base,{h:1,ph:'lobby',g:0,sd:0,du:60,mx:12});
  setPresence(base);
  curKey=null;render();
}
async function createRoom(){
  if(S.busy||!S.room)return;
  S.busy=true;S.err='';render();
  try{
    for(var t=0;t<4;t++){
      var code=randomCode();
      var nr=await S.room.join('tt-'+code.toLowerCase());
      await sleep(1300);
      var taken=nr.peers().some(function(p){return p.kind==='viewer'&&p.presence&&p.presence.h===1&&!p.sameTab});
      if(taken){await nr.leave();continue}
      S.busy=false;enterRoom(nr,code,true);return;
    }
    S.err='Could not open a room. Try again in a moment.';
  }catch(e){S.err='Could not open a room. Try again in a moment.'}
  S.busy=false;render();
}
async function joinRoom(code){
  if(S.busy||!S.room)return;
  code=String(code||'').toUpperCase();
  if(!/^[A-Z]{4}$/.test(code)){setErr('Room codes are 4 letters.');return}
  S.busy=true;S.err='';render();
  try{
    var nr=await S.room.join('tt-'+code.toLowerCase());
    var t0=Date.now(),found=false;
    while(Date.now()-t0<3200){
      if(nr.peers().some(function(p){return p.kind==='viewer'&&p.presence&&p.presence.h===1})){found=true;break}
      await sleep(200);
    }
    if(!found){await nr.leave();S.err='No game found with code '+code+'. Check the letters or ask the host to start one.';S.busy=false;render();return}
    S.busy=false;enterRoom(nr,code,false);return;
  }catch(e){S.err='Could not join that room. Try again.'}
  S.busy=false;render();
}
function leaveRoom(msg){
  abortRound();clearTimeout(hostTO);clearTimeout(connTO);
  S.unsubs.forEach(function(u){try{u()}catch(e){}});S.unsubs=[];
  if(S.nr){try{S.nr.leave()}catch(e){}}
  S.nr=null;S.mode='home';S.err=msg||'';resetMe();curKey=null;render();
}
function startSolo(){
  resetMe();S.mode='solo';S.seen=true;S.lastG=0;S.err='';
  S.soloGame={hostIsMe:true,ph:'lobby',g:0,sd:0,du:60,mx:12};
  curKey=null;render();
}
function exitSolo(){abortRound();S.mode='home';S.soloGame=null;resetMe();curKey=null;render()}
function becomeHost(){setPresence({h:1,ph:'lobby',g:S.lastG,sd:0,du:60,mx:12})}
function copyCode(){
  var p;try{p=navigator.clipboard.writeText(S.code)}catch(e){p=Promise.reject(e)}
  p.then(function(){toast('Code copied')},function(){toast('Code: '+S.code)});
}

/* ---------- teacher tools: only the teacher profile + its PIN can list or remove profiles (checked on the server) ---------- */
function teacherPanel(){
  var T={open:false,pin:'',list:null,msg:'',busy:false,confirm:''};
  var box=h('details',{class:'panel tpanel'});
  box.addEventListener('toggle',function(){T.open=box.open});
  function err(e){var m=String(e&&e.message||'');return /not_allowed/.test(m)?'That PIN does not work for this profile. Open the teacher profile first, then enter its PIN.':'Could not reach the game server. Try again.'}
  async function load(){
    if(!PF.sb||PF.state!=='ready'){T.msg='Open the teacher profile first (type its name above), then enter the PIN.';draw();return}
    T.busy=true;T.msg='';draw();
    try{var r=await PF.sb.rpc('tts_admin_list',{p_code:PF.code,p_pin:T.pin});if(r.error)throw r.error;T.list=r.data||[]}
    catch(e){T.list=null;T.msg=err(e)}
    T.busy=false;draw();
  }
  async function del(it){
    if(T.confirm!==it.handle){T.confirm=it.handle;draw();setTimeout(function(){if(T.confirm===it.handle){T.confirm='';draw()}},4000);return}
    T.confirm='';T.busy=true;draw();
    try{
      var r=await PF.sb.rpc('tts_admin_delete',{p_code:PF.code,p_pin:T.pin,p_handle:it.handle});if(r.error)throw r.error;
      T.msg='Removed "'+it.name+'".';
      var r2=await PF.sb.rpc('tts_admin_list',{p_code:PF.code,p_pin:T.pin});if(!r2.error)T.list=r2.data||[];
      loadLeaderboard();
    }catch(e){T.msg=/not_allowed/.test(String(e&&e.message))?err(e):'Could not remove it. The delete switch may not be installed on the server yet.'}
    T.busy=false;draw();
  }
  function draw(){
    var pin=h('input',{class:'input',type:'password',autocomplete:'off',spellcheck:'false','aria-label':'Teacher PIN',placeholder:'Teacher PIN',value:T.pin,style:'padding-left:14px',
      oninput:function(){T.pin=pin.value},onkeydown:function(e){if(e.key==='Enter')load()}});
    var kids=[h('summary',{class:'label',style:'cursor:pointer'},'Teacher tools')];
    if(T.list===null){
      kids.push(h('p',{class:'note'},'For the teacher only. Open the teacher profile, enter the PIN, and you can remove profiles.'),
        h('div',{class:'joinrow'},pin,h('button',{class:'btn',type:'button',disabled:T.busy,onclick:load},'Unlock')));
    }else{
      kids.push(h('div',{class:'lblist'},T.list.map(function(it){
        return h('div',{class:'lbrow',style:'grid-template-columns:minmax(0,1fr) auto'},
          h('div',null,h('div',{class:'nmtxt'},it.name+(it.me?' (you)':'')),h('div',{class:'sub'},it.rounds+' rounds, best '+it.best)),
          h('div',{class:'actions',style:'justify-content:flex-end'},
            it.me?null:h('button',{class:'btn small danger',type:'button',disabled:T.busy,onclick:function(){del(it)}},T.confirm===it.handle?'Tap again to remove':'Remove')));
      })),h('div',{class:'actions'},h('button',{class:'btn small',type:'button',onclick:function(){T.list=null;T.pin='';T.msg='';draw()}},'Lock')));
    }
    if(T.msg)kids.push(h('p',{class:'note',role:'status'},T.msg));
    box.replaceChildren.apply(box,kids);box.open=T.open;
  }
  draw();
  return box;
}

  var rules=h('div',{class:'rules'},h('div',{class:'label'},'Scoring'),h('ul',null,
    h('li',null,'Right answer: 10 points, plus a streak bonus that grows to 20.'),
    h('li',null,'Wrong answer: no points, your streak resets and the right answer flashes up.'),
    solo?null:h('li',null,'Fall 40 points behind the leader and easier tables unlock for you. At 100 behind you get the easiest set. Points per answer stay the same, so you can catch up.')));
  var right=h('section',{class:'panel'},h('h2',null,'Round rules'),settingsBox,rules,startBox);
  var el=h('div',{class:'lobby'},left,right);
  function upd(){
    var g=game();if(!g)return;
    var isHost=g.hostIsMe;
    if(!solo){
      playersBox.replaceChildren.apply(playersBox,players().map(function(p){
        return h('div',{class:'prow'},avatar(p.n,p.c,36),h('span',{class:'nmtxt'},p.n),p.isMe?tag('You'):null,p.h?tag('Host'):null);
      }));
    }
    settingsBox.replaceChildren(h('p',null,'Every round is 60 seconds, with all the tables up to 12.'));
    if(isHost){
      startBox.replaceChildren.apply(startBox,[h('button',{class:'btn primary big',type:'button',style:'width:100%',onclick:startRound},solo?'Start practice':'Start round'),
        solo?null:h('p',{class:'note',style:'margin-top:8px'},'Wait until everyone shows up in the player list, then start.')].filter(Boolean));
    }else{
      startBox.replaceChildren(h('p',{class:'waiting'},'Waiting for the host to start…'));
    }
  }
  return {el:el,update:upd};
};

VIEWS.game=function(){
  var E={};
  E.timer=h('div',{class:'timer'});
  E.barFill=h('i');E.bar=h('div',{class:'bar'},E.barFill);
  E.score=h('div',{class:'pts'});
  E.right=h('b');E.wrong=h('b');E.streak=h('b');
  E.rank=h('p',{class:'rankline'});
  E.boost=h('div',{class:'boostbar',hidden:true});
  E.count=h('div',{class:'countnum',hidden:true});
  E.q=h('div',{class:'q'});
  E.ansText=h('span');E.ans=h('div',{class:'ans','aria-label':'Your answer'},E.ansText,h('span',{class:'caret'}));
  E.fb=h('div',{class:'fb',role:'status'});
  E.qcard=h('div',{class:'qcard'},E.count,E.q,E.ans,E.fb);
  var keyList=['1','2','3','4','5','6','7','8','9','Del','0','Go'];
  E.keys=h('div',{class:'keys'},keyList.map(function(k){
    var cls='key'+(k==='Del'?' fn':k==='Go'?' go':'');
    return h('button',{type:'button',class:cls,'aria-label':k==='Del'?'Backspace':k==='Go'?'Submit answer':k,onclick:function(){if(k==='Del')backspace();else if(k==='Go')submit();else inputDigit(k)}},k);
  }));
  E.lb=h('div',null);
  E.trackLanes=h('div',{class:'track'});E.laneMap={};E.track=h('div',{class:'trackwrap'},h('div',{class:'track-cap'},h('span',null,'Race track'),h('span',null,'Finish line →')),E.trackLanes);
  var play=h('div',{class:'playcol'},
    h('div',{class:'hud'},
      h('div',{class:'hud-top'},h('div',{class:'timer-wrap'},E.timer),h('div',{class:'scorebox'},h('div',{class:'label'},'Score'),E.score)),
      E.bar,
      h('div',{class:'statrow'},h('span',null,'Right ',E.right),h('span',null,'Wrong ',E.wrong),h('span',null,'Streak ',E.streak))),
    E.track,E.rank,E.boost,E.qcard,E.keys);
  var side=h('aside',{class:'side'},h('h2',null,'Live standings'),E.lb);
  var el=h('div',{class:'game-grid'},play,side);
  GV=E;
  return {el:el,update:drawGame};
};
function updateTimer(now){
  var E=GV;if(!E||!P.G)return;
  var rem=Math.max(0,P.roundEnd-(now||Date.now()));
  var secs=Math.ceil(rem/1000);
  E.timer.replaceChildren(String(secs),h('small',null,'s'));
  E.barFill.style.transform='scaleX('+(rem/(P.G.du*1000))+')';
  E.bar.classList.toggle('low',secs<=10);
}
function drawGame(){
  var E=GV;if(!E||!P.G)return;
  var counting=me.phase==='count';
  E.count.hidden=!counting;E.q.hidden=counting;E.ans.hidden=counting;
  E.keys.classList.toggle('off',counting);
  if(counting)E.count.textContent=String(Math.max(1,Math.ceil((P.countEnd-Date.now())/1000)));
  if(P.q&&!counting&&P.qShown!==P.i){
    var x=P.q.flip?P.q.b:P.q.a,y=P.q.flip?P.q.a:P.q.b;
    E.q.replaceChildren(String(x),h('span',{class:'x'},'×'),String(y));
    P.qShown=P.i;
  }
  E.ansText.textContent=P.typed;
  E.qcard.className='qcard'+(P.flash?' '+P.flash:'');
  E.fb.className='fb'+(P.fbKind?' '+P.fbKind:'');E.fb.textContent=P.fbText;
  E.score.textContent=String(me.sc);E.right.textContent=String(me.r);E.wrong.textContent=String(me.w);E.streak.textContent=String(me.st);
  updateTimer();
  var ps=roundPlayers(P.G);
  var i=ps.findIndex(function(p){return p.isMe});
  var line='';
  if(S.mode==='solo')line=P.best?'Your best at this setting: '+P.best:'Set your first score.';
  else if(i===0&&ps.length>1){var gp=ps[0].sc-ps[1].sc;line=gp>0?'You lead by '+gp+'.':'You are tied for the lead.'}
  else if(i>0)line=ordinal(i+1)+' place. '+(ps[0].sc-ps[i].sc)+' behind '+ps[0].n+'.';
  E.rank.textContent=line;
  E.boost.hidden=me.lv===0;
  E.boost.textContent=me.lv===2?'Turbo comeback. Only the friendliest tables now, same points per answer.':'Comeback boost on. Easier tables, same points per answer. Use it to catch up.';
  E.lb.replaceChildren(lbList(liveItems(ps),true));
  drawTrack(E,ps);
  if(S.mode==='solo')E.lb.parentNode.hidden=true;
}
function drawTrack(E,ps){
  var items=ps.map(function(p){return {id:String(p.id||p.n),n:p.n,c:p.c,sc:p.sc,isMe:!!p.isMe}});
  if(S.mode==='solo'){
    items=[{id:'me',n:S.name,c:S.color,sc:me.sc,isMe:true}];
    if(P.best)items.push({id:'ghost',n:'Your best',c:7,sc:P.best,isMe:false,ghost:true});
  }
  // keep it readable: top 6 plus me
  var shown=items.slice(0,6);
  if(!shown.some(function(x){return x.isMe})){var m=items.filter(function(x){return x.isMe})[0];if(m)shown.push(m)}
  var lead=0;items.forEach(function(x){lead=Math.max(lead,x.sc)});
  var finish=Math.max(200,lead*1.15);
  var keep={};
  shown.forEach(function(x){
    keep[x.id]=1;
    var lane=E.laneMap[x.id];
    if(!lane){
      var pt=h('span',{class:'pt'});
      var runner=h('div',{class:'runner'},avatar(x.n,x.c,28),pt);
      lane=E.laneMap[x.id]={el:h('div',{class:'lane'},runner),runner:runner,pt:pt};
    }
    lane.el.className='lane'+(x.isMe?' me':'')+(x.ghost?' ghost':'');
    var frac=Math.min(1,x.sc/finish);
    lane.runner.style.left='calc('+(frac*100).toFixed(1)+'% - '+(frac*64).toFixed(0)+'px)';
    lane.pt.textContent=(x.isMe?'You ':x.n+' ')+x.sc;
  });
  Object.keys(E.laneMap).forEach(function(k){if(!keep[k]){E.laneMap[k].el.remove();delete E.laneMap[k]}});
  // order lanes by current rank
  shown.forEach(function(x){E.trackLanes.append(E.laneMap[x.id].el)});
}

function standingsView(watching){
  var title=h('h2'),sub=h('p',{class:'note'}),box=h('div');
  var el=h('div',{class:'stack'},h('section',{class:'panel'},title,sub),box);
  function upd(){
    var g=game();if(!g)return;
    var ps=roundPlayers(g);
    var left=ps.filter(function(p){return !p.fin}).length;
    if(watching){title.textContent='Round in progress';sub.textContent='You joined mid-round, so you will play the next one. Watch the standings in the meantime.'}
    else{title.textContent='Time is up';sub.textContent='You got '+me.r+' right and '+me.w+' wrong for '+me.sc+' points. '+(left>0?left+' still playing…':'Waiting for the host to show results…')}
    box.replaceChildren(lbList(liveItems(ps),true));
  }
  return {el:el,update:upd};
}
VIEWS.wait=function(){return standingsView(false)};
VIEWS.watch=function(){return standingsView(true)};

VIEWS.results=function(){
  var el=h('div',{class:'stack'});var lastSig='';
  function upd(){
    var g=game();if(!g)return;
    var solo=S.mode==='solo';
    var all=players();
    var sig=JSON.stringify([g.g,S.resTab,me.rd,me.sc,g.hostIsMe,all.map(function(p){return [p.id,p.sc,p.r,p.w,p.base,p.rd,p.fin]})]);
    if(sig===lastSig)return;lastSig=sig;
    var round=all.map(function(p){return p.isMe&&me.rd===g.g?Object.assign({},p,{sc:me.sc,r:me.r,w:me.w,bs:me.bs}):p}).filter(function(p){return p.rd===g.g}).sort(cmp);
    var showSession=!solo&&g.g>1;
    var tab=showSession?S.resTab:'round';
    var items;
    if(tab==='round'){
      items=round.map(function(p){var t=p.r+p.w;return {isMe:p.isMe,n:p.n,c:p.c,lv:0,pts:p.sc,meta:p.r+' right · '+p.w+' wrong'+(t?' · '+Math.round(p.r/t*100)+'%':'')}});
    }else{
      items=all.map(function(p){var sc=p.base+p.sc,r=p.br+p.r,w=p.bw+p.w;return {isMe:p.isMe,n:p.n,c:p.c,lv:0,pts:sc,w:w,meta:r+' right · '+w+' wrong'}})
        .sort(function(a,b){return b.pts-a.pts||a.w-b.w});
    }
    var out=[];
    var top=round[0];
    if(top){
      var tie=round.length>1&&round[1].sc===top.sc&&round[1].w===top.w;
      out.push(h('div',{class:'winner'},avatar(top.n,top.c,56),h('div',null,
        h('h2',null,solo?(P.newBest?'New personal best':'Round complete'):(tie?'It is a tie at the top':top.n+' wins the round')),
        h('p',null,solo?me.sc+' points. '+me.r+' right, '+me.w+' wrong.'+(P.best?' Best at this setting: '+P.best+'.':''):top.sc+' points'+(tie?' for '+top.n+' and '+round[1].n+'.':'.')))));
    }
    if(showSession){
      out.push(h('div',{class:'seg',role:'group','aria-label':'Choose standings'},[['round','This round'],['session','Session total']].map(function(o){
        return h('button',{type:'button',class:'segbtn',style:'min-width:110px','aria-pressed':String(tab===o[0]),onclick:function(){S.resTab=o[0];lastSig='';upd()}},o[1]);
      })));
    }
    out.push(lbList(items,false));
    var played=round.filter(function(p){return p.r+p.w>0});
    if(!solo&&played.length>1){
      var mc=played.slice().sort(function(a,b){return b.r-a.r})[0];
      var bs=played.slice().sort(function(a,b){return b.bs-a.bs})[0];
      out.push(h('div',{class:'awards'},
        h('div',{class:'award'},h('span',{class:'label'},'Most correct'),h('b',null,mc.n+' · '+mc.r)),
        bs.bs>1?h('div',{class:'award'},h('span',{class:'label'},'Longest streak'),h('b',null,bs.n+' · '+bs.bs)):null));
    }
    if(me.rd===g.g&&(me.r+me.w)>0){
      var rows=[h('span')];
      for(var b=1;b<=12;b++)rows.push(h('span',{class:'lab'},String(b)));
      for(var a=2;a<=g.mx;a++){
        rows.push(h('span',{class:'lab'},String(a)));
        for(b=1;b<=12;b++){var st=P.grid.get(a+'x'+b);rows.push(h('span',{class:'cell'+(st?' '+st:''),title:a+' × '+b}))}
      }
      var miss=Array.from(P.missed.values()).sort(function(x,y){return y.n-x.n}).slice(0,14);
      out.push(h('section',{class:'panel'},
        h('h2',null,'Your times table map'),
        h('div',{class:'mapwrap'},h('div',{class:'map'},rows)),
        h('div',{class:'legend'},h('span',{class:'l-ok'},'Right'),h('span',{class:'l-miss'},'Missed'),h('span',null,'Not asked')),
        h('div',{class:'label'},'Tricky ones to practise'),
        miss.length?h('div',{class:'mchips'},miss.map(function(m){return h('span',{class:'mchip'},m.a+' × '+m.b+' = '+(m.a*m.b),m.n>1?h('i',null,'×'+m.n):null)})):h('p',{class:'note'},'No misses. Clean round.')));
    }
    if(P.recorded&&me.rd===g.g)out.push(h('p',{class:'note'},PF.code?(P.newBest?'New personal best! ':'')+'Round saved to your profile.':'Not saved. Make a profile on the home screen to keep your scores.'));
    if(g.hostIsMe){
      out.push(h('div',{class:'actions'},
        h('button',{class:'btn primary big',type:'button',onclick:startRound},solo?'Practice again':'Play again'),
        h('button',{class:'btn big',type:'button',onclick:function(){if(solo)exitSolo();else hostSet({ph:'lobby'})}},solo?'Back to home':'Back to lobby')));
    }else{
      out.push(h('p',{class:'waiting'},'Waiting for the host to start the next round…'));
    }
    el.replaceChildren.apply(el,out);
  }
  return {el:el,update:upd};
};

/* ---------- render ---------- */
function viewKey(){
  if(S.mode==='home')return S.sub==='profile'?'profile':'home';
  var g=game();
  if(!g)return (S.mode==='room'&&S.seen)?'nohost':'finding';
  if(me.phase==='count'||me.phase==='play')return 'game';
  if(g.ph==='lobby')return 'lobby';
  if(g.ph==='results')return 'results';
  return me.phase==='done'?'wait':'watch';
}
function renderTop(){
  var t=document.getElementById('top');
  var chips=h('div',{class:'chips'});
  if(S.mode==='room'){
    if(!S.conn)chips.append(h('span',{class:'chip warn'},'Reconnecting…'));
    chips.append(h('button',{class:'chip',type:'button','aria-label':'Copy room code',onclick:copyCode},'Room ',h('b',null,S.code)),
      h('button',{class:'btn small',type:'button',onclick:function(){leaveRoom()}},'Leave'));
  }else if(S.mode==='solo'){
    chips.append(h('span',{class:'chip'},'Solo practice'),h('button',{class:'btn small',type:'button',onclick:exitSolo},'Exit'));
  }
  t.replaceChildren(h('div',{class:'brand'},h('span',{class:'brand-mark','aria-hidden':'true'},'×'),h('span',null,'Math Mayhem')),chips);
}
function render(){
  var k=viewKey();
  renderTop();
  if(k!==curKey){
    if(curKey==='game')GV=null;
    curKey=k;curView=VIEWS[k]();
    document.getElementById('main').replaceChildren(curView.el);
  }
  if(curView&&curView.update)curView.update();
}

document.addEventListener('keydown',function(e){
  if(curKey!=='game'||me.phase!=='play'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();inputDigit(e.key)}
  else if(e.key==='Backspace'){e.preventDefault();backspace()}
  else if(e.key==='Enter'){e.preventDefault();submit()}
});

/* ---------- boot ---------- */
S.name=randomName();
S.color=rint(COLORS);
var SB=null;
try{
  if(window.supabase&&SUPABASE_URL)SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
    auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
}catch(e){SB=null}
S.room=SB?makeRoomApi(SB):null;S.roomState=S.room?'ready':'unavailable';
PF.sb=SB;PF.dbState=SB?'ready':'unavailable';
render();
(async function(){
  var saved=lsGet('tts-code');
  if(SB&&saved){var r=await openProfile(saved);if(r==='notfound'||r==='invalid')closeProfile()}
  refreshProfileUI();
})();
})();
</script>
